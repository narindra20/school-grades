openapi: 3.0.3
info:
  title: HEI - Graduate Management API
  description: >
    API for managing grades, groups, tracks and graduates at HEI.
    Roles: STUDENT (read own grades only), TEACHER (read/write grades of
    students they actually teach), ADMIN (full access).
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Auth
  - name: Grades
  - name: Transcripts
  - name: Graduates
  - name: Cohorts
  - name: Web
  - name: Admin - Users
  - name: Admin - Students
  - name: Admin - Teachers
  - name: Admin - Cohorts
  - name: Admin - Tracks
  - name: Admin - Groups
  - name: Admin - Courses
  - name: Admin - CourseAssignments
  - name: Admin - Exams

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  role: {$ref: '#/components/schemas/Role'}
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{studentId}/grades:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Grades]
      summary: List a student's grades
      description: >
        STUDENT: own grades only (studentId = principal).
        TEACHER: only if they actually taught this student on at least one course (enforced server-side).
        ADMIN: full access.
      responses:
        '200':
          description: List of grades
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Grade'}
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Grades]
      summary: Create a grade (initial entry)
      description: TEACHER (ownership of course/group/exam) or ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GradeCreateRequest'}
      responses:
        '201':
          description: Grade created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Grade'}
        '403':
          description: "The teacher did not teach this student on this course"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /grades/{gradeId}:
    parameters:
      - $ref: '#/components/parameters/GradeId'
    get:
      tags: [Grades]
      summary: Grade detail
      responses:
        '200':
          description: Grade
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Grade'}
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Grades]
      summary: Update a grade (dispute, correction)
      description: >
        TEACHER (ownership verified via COURSE_ASSIGNMENT_TEACHING + STUDENT_GROUP_HISTORY)
        or ADMIN. Automatically creates a GRADE_HISTORY entry.
        Reason is mandatory.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GradeUpdateRequest'}
      responses:
        '200':
          description: Grade updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Grade'}
        '403':
          description: "The teacher did not teach this student on this course"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /grades/{gradeId}/history:
    parameters:
      - $ref: '#/components/parameters/GradeId'
    get:
      tags: [Grades]
      summary: Grade modification history
      description: Read-only, generated automatically. No write endpoint exists for this resource.
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/GradeHistory'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{studentId}/transcript/send:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Transcripts]
      summary: Trigger asynchronous PDF transcript generation and email delivery
      description: STUDENT (self), TEACHER (ownership), or ADMIN. Asynchronous processing (@Async), immediate 202 response.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [academicYear]
              properties:
                academicYear: {type: string, example: "2024-2025"}
      responses:
        '202':
          description: Accepted, delivery in progress in background
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TranscriptDelivery'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /students/{studentId}/transcript-deliveries:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Transcripts]
      summary: Transcript delivery history for a student
      description: Read-only, audit trail. No manual creation possible.
      responses:
        '200':
          description: Delivery history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TranscriptDelivery'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/transcript-deliveries:
    get:
      tags: [Admin - Students]
      summary: Global transcript delivery history (audit)
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TranscriptDelivery'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /cohorts/{cohortId}/graduates/export:
    parameters:
      - $ref: '#/components/parameters/CohortId'
    get:
      tags: [Graduates]
      summary: Download the XLSX file of graduates for a cohort
      description: >
        Columns Rank, StudentNumber, LastName, FirstName, OverallAverage — sorted by rank.
        Direct download, no email. ADMIN only.
      responses:
        '200':
          description: XLSX file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cohorts:
    get:
      tags: [Cohorts]
      summary: List all cohorts
      responses:
        '200':
          description: List of cohorts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Cohort'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /web/cohorts:
    get:
      tags: [Web]
      summary: HTML page listing cohorts with a graduates download button
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string

        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/users:
    get:
      tags: [Admin - Users]
      summary: List users
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin - Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Admin - Users]
      summary: User detail
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Admin - Users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdateRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Admin - Users]
      summary: Deactivate a user (soft delete)
      description: >
        Implemented as a soft delete (active=false field), never a real SQL deletion,
        to preserve the integrity of related historical GRADE/COURSE_ASSIGNMENT_TEACHING records.
      responses:
        '204': {description: Deactivated}
        '409':
          description: "Blocked: related historical data exists"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/students:
    get:
      tags: [Admin - Students]
      summary: List students
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Student'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin - Students]
      summary: Create a student
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StudentCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Admin - Students]
      summary: Student detail
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Admin - Students]
      summary: Update a student
      description: "studentNumber is NOT updatable (fixed identifier for life)."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StudentUpdateRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Student'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Admin - Students]
      summary: Deactivate a student (soft delete)
      responses:
        '204': {description: Deactivated}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/students/{studentId}/change-group:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Admin - Students]
      summary: Change a student's group (business action, not a raw CRUD)
      description: >
        Automatically closes the active STUDENT_GROUP_HISTORY entry (endDate = changeDate)
        and creates a new one. Deliberately no free PUT/DELETE on
        STUDENT_GROUP_HISTORY, to preserve the invariant "at most one active group at a time".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newGroupId, changeDate]
              properties:
                newGroupId: {type: string, format: uuid}
                changeDate: {type: string, format: date}
      responses:
        '200':
          description: Change applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentGroupHistory'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/students/{studentId}/group-history:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Admin - Students]
      summary: A student's group history
      description: ADMIN, or TEACHER if concerned by at least one of the groups.
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/StudentGroupHistory'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/teachers:
    get:
      tags: [Admin - Teachers]
      summary: List teachers
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Teacher'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin - Teachers]
      summary: Create a teacher
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeacherCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Teacher'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/teachers/{teacherId}:
    parameters:
      - name: teacherId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Admin - Teachers]
      summary: Teacher detail
      responses:
        '200':
          description: Teacher
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Teacher'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Admin - Teachers]
      summary: Update a teacher
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeacherCreateRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Teacher'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Admin - Teachers]
      summary: Deactivate a teacher (soft delete)
      description: Soft delete if COURSE_ASSIGNMENT_TEACHING records exist, to preserve the record of who taught what.
      responses:
        '204': {description: Deactivated}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/cohorts:
    post:
      tags: [Admin - Cohorts]
      summary: Create a cohort
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CohortCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cohort'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/cohorts/{cohortId}:
    parameters:
      - $ref: '#/components/parameters/CohortId'
    get:
      tags: [Admin - Cohorts]
      summary: Cohort detail
      responses:
        '200':
          description: Cohort
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cohort'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Admin - Cohorts]
      summary: Update a cohort
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CohortCreateRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cohort'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Admin - Cohorts]
      summary: Delete a cohort
      description: Rejected (409) if STUDENT or GROUP records are linked.
      responses:
        '204': {description: Deleted}
        '409':
          description: "Students or groups are linked to this cohort"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/tracks:
    get:
      tags: [Admin - Tracks]
      summary: List tracks
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Track'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin - Tracks]
      summary: Create a track
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrackCreateRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Track'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/tracks/{trackId}:
    parameters:
      - name: trackId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      tags: [Admin - Tracks]
      summary: Update a track
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrackCreateRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Track'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Admin - Tracks]
      summary: Delete a track
