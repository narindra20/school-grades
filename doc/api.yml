components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GradeId:
      name: gradeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CohortId:
      name: cohortId
      in: path
      required: true
      schema: {type: string, format: uuid}

  schemas:
    Role:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]

    ExamType:
      type: string
      enum: [REGULAR, RESIT]

    DeliveryStatus:
      type: string
      enum: [IN_PROGRESS, SENT, FAILED]

    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}

    UserCreateRequest:
      type: object
      required: [email, password, role]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
        role: {$ref: '#/components/schemas/Role'}

    UserUpdateRequest:
      type: object
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
        role: {$ref: '#/components/schemas/Role'}

    Student:
      type: object
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        cohortId: {type: string, format: uuid}
        lastName: {type: string}
        firstName: {type: string}
        studentNumber: {type: string, example: "24001"}
        workStudy: {type: boolean}

    StudentCreateRequest:
      type: object
      required: [userId, cohortId, lastName, firstName, studentNumber]
      properties:
        userId: {type: string, format: uuid}
        cohortId: {type: string, format: uuid}
        lastName: {type: string}
        firstName: {type: string}
        studentNumber: {type: string}
        workStudy: {type: boolean, default: false}

    StudentUpdateRequest:
      type: object
      description: "studentNumber deliberately absent — not updatable after creation."
      properties:
        lastName: {type: string}
        firstName: {type: string}
        workStudy: {type: boolean}
        cohortId: {type: string, format: uuid}

    Teacher:
      type: object
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        lastName: {type: string}
        firstName: {type: string}

    TeacherCreateRequest:
      type: object
      required: [userId, lastName, firstName]
      properties:
        userId: {type: string, format: uuid}
        lastName: {type: string}
        firstName: {type: string}

    Cohort:
      type: object
      properties:
        id: {type: string, format: uuid}
        entryYear: {type: integer, example: 2024}

    CohortCreateRequest:
      type: object
      required: [entryYear]
      properties:
        entryYear: {type: integer}

    Track:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string, example: "EL"}

    TrackCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}

    Group:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: "K1"}
        trackId: {type: string, format: uuid, nullable: true}
        cohortId: {type: string, format: uuid}

    GroupCreateRequest:
      type: object
      required: [code, cohortId]
      properties:
        code: {type: string}
        trackId: {type: string, format: uuid, nullable: true}
        cohortId: {type: string, format: uuid}

    StudentGroupHistory:
      type: object
      properties:
        id: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        groupId: {type: string, format: uuid}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date, nullable: true}

    Course:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: "prog2"}
        title: {type: string}
        credits: {type: integer}
        level: {type: string, enum: [L1, L2, L3]}
        semester: {type: string, example: "S2"}

    CourseCreateRequest:
      type: object
      required: [code, title, credits, level, semester]
      properties:
        code: {type: string}
        title: {type: string}
        credits: {type: integer}
        level: {type: string, enum: [L1, L2, L3]}
        semester: {type: string}

    CourseAssignment:
      type: object
      properties:
        id: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        academicYear: {type: string, example: "2024-2025"}

    CourseAssignmentCreateRequest:
      type: object
      required: [courseId, academicYear]
      properties:
        courseId: {type: string, format: uuid}
        academicYear: {type: string}

    CourseAssignmentTeaching:
      type: object
      properties:
        id: {type: string, format: uuid}
        assignmentId: {type: string, format: uuid}
        teacherId: {type: string, format: uuid}
        groupId: {type: string, format: uuid}

    Exam:
      type: object
      properties:
        id: {type: string, format: uuid}
        assignmentId: {type: string, format: uuid}
        label: {type: string, example: "OOP"}
        examDate: {type: string, format: date-time}
        coefficient: {type: number, format: double, example: 0.6}
        type: {$ref: '#/components/schemas/ExamType'}

    ExamCreateRequest:
      type: object
      required: [label, examDate, coefficient]
      properties:
        label: {type: string}
        examDate: {type: string, format: date-time}
        coefficient: {type: number, format: double}
        type:
          allOf: [$ref: '#/components/schemas/ExamType']
          default: REGULAR

    Grade:
      type: object
      properties:
        id: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        examId: {type: string, format: uuid}
        value: {type: number, format: double, minimum: 0, maximum: 20}
        gradedDate: {type: string, format: date}

    GradeCreateRequest:
      type: object
      required: [studentId, examId, value]
      properties:
        studentId: {type: string, format: uuid}
        examId: {type: string, format: uuid}
        value: {type: number, format: double, minimum: 0, maximum: 20}

    GradeUpdateRequest:
      type: object
      required: [value, reason]
      properties:
        value: {type: number, format: double, minimum: 0, maximum: 20}
        reason:
          type: string
          description: Mandatory — covers student disputes among other cases.
          example: "Student dispute — grading error on question 3"

    GradeHistory:
      type: object
      properties:
        id: {type: string, format: uuid}
        gradeId: {type: string, format: uuid}
        oldValue: {type: number, format: double}
        newValue: {type: number, format: double}
        reason: {type: string}
        modifiedAt: {type: string, format: date-time}

    TranscriptDelivery:
      type: object
      properties:
        id: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        academicYear: {type: string}
        sentAt: {type: string, format: date-time}
        s3Url: {type: string, format: uri}
        status: {$ref: '#/components/schemas/DeliveryStatus'}
    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Resource not found
        path:
          type: string
          example: /students/123/grades
  responses:
    BadRequest:
      description: Invalid request (validation error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with current state / business rule / referential integrity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'